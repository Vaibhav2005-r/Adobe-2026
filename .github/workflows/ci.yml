name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: brand-ai-readiness-audit

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: skills-ref validate (all 8 skills)
        run: |
          set -e
          for d in skills/*/; do
            echo "=== $d ==="
            npx --yes skills-ref validate "$d"
          done

      - name: Manifest lint
        run: python skills/ai-visibility-orchestrator/scripts/lint_marketplace.py

      - name: Schema drift check
        run: |
          set -e
          python skills/ai-visibility-orchestrator/scripts/gen_schema.py
          git diff --exit-code skills/ai-visibility-orchestrator/assets/report_schema.json || {
            echo "::error::report_schema.json is stale -- run gen_schema.py and commit the result";
            exit 1;
          }

      - name: Smoke test (pipeline skeleton + determinism, local fixture only)
        run: python -m pytest tests/ -v
